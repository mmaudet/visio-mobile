[package]
name = "visio-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
oidc = []
# Bespoke VC1:-prefixed AES-256-GCM chat encryption. Off by default because
# the Meet web client doesn't implement a matching decoder — turning it on
# breaks cross-client chat interop until both ends ship a compatible scheme.
chat-encryption = []

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
livekit = { workspace = true, features = ["rustls-tls-webpki-roots"] }
livekit-api = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
futures-util = { workspace = true }
rand = "0.8"
regex = "1"
ical = "0.11"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
livekit-api = { workspace = true }
mockito = "1"
