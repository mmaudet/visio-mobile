name: i18n

on:
  push:
    branches: [main]
    paths: ['i18n/en.json']
  pull_request:
    paths: ['i18n/**']
  schedule:
    - cron: '0 6 * * 1'

jobs:
  check-missing-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for missing translation keys
        run: ./scripts/check-i18n.sh
