name: Build & Distribute Android

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for testers"
        required: false
        default: ""
      publish:
        description: "Upload AAB to Play Store internal track"
        required: false
        type: boolean
        default: false
  push:
    # Pushing a semver tag triggers a build + automatic Play Store
    # upload. Use vX.Y.Z for prod-ready releases (Play Store internal
    # track, ready to promote to production from the console) and
    # vX.Y.Z-rcN for release candidates (build only, no upload).
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

permissions:
  contents: read

# A new dispatch of this workflow on the same ref cancels the in-progress
# one. Keeps the iteration loop from racking up 5 parallel Android builds
# fighting for the Play Store upload slot when we re-trigger during a
# debug session.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-24.04
    # Android build path: ~10-15 min healthy, 25 min with cold cargo cache.
    # Tighter than default 6h so a hung step (Tauri DMG-style hang) fails
    # in minutes instead of burning runner hours.
    timeout-minutes: 45
    # id-token: write is required for google-github-actions/auth to mint a
    # GitHub OIDC token that GCP STS exchanges for a short-lived access
    # token (WIF). contents: read overrides the workflow-level default
    # which gets erased once we set a job-level permissions block.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .

    steps:
      # Pin to immutable SHA so retags on the trigger ref don't break the
      # checkout mid-build (we sometimes move v0.10.0 forward between CI
      # iterations on other workflows).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          rust-targets: aarch64-linux-android
          cache-key: android-arm64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android NDK
        uses: android-actions/setup-android@651bceb6f9ca583f16b8d75b62c36ded2ae6fc9c # v4

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies for UniFFI bindgen
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libva-dev

      - name: Compile Rust native libraries
        run: cargo ndk -t arm64-v8a build -p visio-ffi -p visio-video --release

      - name: Generate UniFFI Kotlin bindings
        run: bash scripts/generate-bindings.sh kotlin

      - name: Copy .so files to jniLibs
        run: |
          rm -rf android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libvisio_ffi.so android/app/src/main/jniLibs/arm64-v8a/
          cp target/aarch64-linux-android/release/libvisio_video.so android/app/src/main/jniLibs/arm64-v8a/
          LIBCXX=$(find $ANDROID_NDK_HOME -name "libc++_shared.so" -path "*/aarch64-linux-android/*" | head -1)
          if [ -n "$LIBCXX" ]; then cp "$LIBCXX" android/app/src/main/jniLibs/arm64-v8a/; fi

      - name: Copy libwebrtc.jar
        run: |
          mkdir -p android/app/libs
          WEBRTC_JAR=$(find target -name "libwebrtc.jar" -path "*/android-arm64-release/*" 2>/dev/null | head -1)
          if [ -n "$WEBRTC_JAR" ]; then
            cp "$WEBRTC_JAR" android/app/libs/
          else
            echo "::error::libwebrtc.jar not found"
            exit 1
          fi

      - name: Decode keystore
        # echo adds a trailing newline that can corrupt the decoded binary;
        # printf '%s' emits the secret verbatim and base64 -d ignores
        # whitespace, so the decoded keystore is byte-identical to the source.
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 -d > android/app/release.keystore

      - name: Authenticate to Google Cloud via Workload Identity Federation
        # Exchanges the job's GitHub OIDC token (id-token: write above) for a
        # short-lived (~1h) GCP access token bound to the Play Store service
        # account, then writes an "external account" credentials JSON to a
        # temp path and exports GOOGLE_APPLICATION_CREDENTIALS pointing at it.
        # No long-lived JSON private key lives in the secrets anymore.
        # Gated by the same condition as the upload step below — there's no
        # value in burning an STS exchange on builds that won't upload.
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish == true) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc'))
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAY_STORE_SA }}
          create_credentials_file: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build AAB for Google Play
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Monotonic versionCode from the run number. Without it the
          # build.gradle.kts fallback (`?: 1`) ships version_code=1 — which
          # Play Store rejects as already-used by an earlier release.
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease

      - name: Upload AAB to Google Play (internal track)
        # Publish when explicitly requested via workflow_dispatch input OR
        # when triggered by a non-RC semver tag push (vX.Y.Z, not -rcN).
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish == true) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc'))
        working-directory: android
        env:
          # google-github-actions/auth above sets GOOGLE_APPLICATION_CREDENTIALS
          # to a temp external-account JSON. Fastlane supply accepts that
          # path the same way it accepts a service-account JSON.
          SUPPLY_JSON_KEY_PATH: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        run: bundle exec fastlane release

      - name: Package native debug symbols
        run: |
          SYMBOLS_DIR="android/app/build/outputs/native-debug-symbols/release"
          mkdir -p "$SYMBOLS_DIR/lib/arm64-v8a"
          for lib in libvisio_ffi.so libvisio_video.so; do
            UNSTRIPPED=$(find target/aarch64-linux-android/release -name "$lib" -not -path "*/stripped/*" | head -1)
            if [ -n "$UNSTRIPPED" ]; then
              cp "$UNSTRIPPED" "$SYMBOLS_DIR/lib/arm64-v8a/"
            fi
          done
          cd "$SYMBOLS_DIR" && zip -r "$GITHUB_WORKSPACE/android-debug-symbols.zip" lib/

      - name: Find built AAB
        id: find-aab
        if: always()
        run: |
          AAB=$(find android/app/build/outputs -name "*.aab" -type f | head -1)
          if [ -n "$AAB" ]; then
            echo "aab_path=$AAB" >> $GITHUB_OUTPUT
            echo "Found AAB: $AAB"
          else
            echo "No AAB found"
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: steps.find-aab.outputs.aab_path != ''
        with:
          name: android-aab
          path: ${{ steps.find-aab.outputs.aab_path }}
          retention-days: 14

      - name: Upload native debug symbols
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: android-debug-symbols
          path: android-debug-symbols.zip
          if-no-files-found: warn
          retention-days: 30
