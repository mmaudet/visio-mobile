name: Promote Android to Production

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code of the build to promote (from github.run_number)"
        required: true
        type: string
      source_track:
        description: "Source track to promote from"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAY_STORE_SA }}
          create_credentials_file: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Promote to production (general availability)
        working-directory: android
        env:
          SUPPLY_JSON_KEY_PATH: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          VERSION_CODE: ${{ inputs.version_code || github.event.inputs.version_code }}
        run: bundle exec fastlane promote_to_production
