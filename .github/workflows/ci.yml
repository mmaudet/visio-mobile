name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-git:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitlint
        run: pip install gitlint
      - name: Lint commit messages
        run: gitlint --commits origin/${{ github.base_ref }}..HEAD

  check-changelog:
    if: >
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'noChangeLog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check CHANGELOG was updated
        run: |
          if git diff --name-only HEAD~1 | grep -q "CHANGELOG.md"; then
            echo "CHANGELOG.md was updated."
          else
            echo "::error::CHANGELOG.md was not modified."
            exit 1
          fi

  lint-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CHANGELOG max line length
        run: |
          max_line_length=$(cat CHANGELOG.md \
            | grep -Ev "^\[.*\]: https://github.com" | wc -L)
          if [ $max_line_length -ge 80 ]; then
            echo "::error::CHANGELOG has lines > 80 characters."
            exit 1
          fi

  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libva-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Check formatting
        run: cargo fmt -p visio-core -- --check
      - name: Clippy
        run: cargo clippy -p visio-core -- -D warnings

  lint-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Kotlin lint
        working-directory: android
        run: ./gradlew ktlintCheck

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/visio-desktop/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: >
            crates/visio-desktop/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npx eslint src/ --max-warnings 0
      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libva-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Install LiveKit server
        run: |
          curl -sSL https://get.livekit.io | bash
          livekit-server --dev &
          sleep 3
      - name: Run unit tests
        run: cargo test -p visio-core --lib
      - name: Run integration tests
        run: cargo test -p visio-core --test integration_livekit
        env:
          LIVEKIT_URL: ws://localhost:7880
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret

  test-android-ui:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: cd android && ./gradlew connectedAndroidTest
