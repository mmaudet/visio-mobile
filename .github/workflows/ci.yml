name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-git:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Install gitlint
        run: pip install gitlint
      - name: Lint commit messages
        run: gitlint --commits origin/${{ github.base_ref }}..HEAD

  check-changelog:
    if: >
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'noChangeLog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2
      - name: Check CHANGELOG was updated
        run: |
          if git diff --name-only HEAD~1 | grep -q "CHANGELOG.md"; then
            echo "CHANGELOG.md was updated."
          else
            echo "::error::CHANGELOG.md was not modified."
            exit 1
          fi

  lint-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check CHANGELOG max line length
        run: |
          max_line_length=$(cat CHANGELOG.md \
            | grep -Ev "^\[.*\]: https://github.com" | wc -L)
          if [ $max_line_length -ge 80 ]; then
            echo "::error::CHANGELOG has lines > 80 characters."
            exit 1
          fi

  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libva-dev
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01 # v2
        with:
          key: lint
      - name: Check formatting
        run: cargo fmt -p visio-core -- --check
      - name: Clippy
        run: cargo clippy -p visio-core -- -D warnings

  lint-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Kotlin lint
        working-directory: android
        run: ./gradlew ktlintCheck

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/visio-desktop/frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: >
            crates/visio-desktop/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npx eslint src/
      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libva-dev
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01 # v2
        with:
          key: test
      - name: Install LiveKit server
        run: |
          curl -sSL https://get.livekit.io | bash
          livekit-server --dev &
          sleep 3
      - name: Run unit tests
        run: cargo test -p visio-core --lib
      - name: Run integration tests
        run: cargo test -p visio-core --test integration_livekit
        env:
          LIVEKIT_URL: ws://localhost:7880
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret

  test-android-ui:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01 # v2
        with:
          key: android-x86_64-test

      - name: Set up Android NDK
        uses: android-actions/setup-android@651bceb6f9ca583f16b8d75b62c36ded2ae6fc9c # v4

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies for UniFFI bindgen
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libva-dev

      - name: Compile Rust native libraries for emulator
        run: cargo ndk -t x86_64 build -p visio-ffi -p visio-video --release

      - name: Generate UniFFI Kotlin bindings
        run: bash scripts/generate-bindings.sh kotlin

      - name: Copy .so files to jniLibs
        run: |
          rm -rf android/app/src/main/jniLibs/x86_64
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp target/x86_64-linux-android/release/libvisio_ffi.so android/app/src/main/jniLibs/x86_64/
          cp target/x86_64-linux-android/release/libvisio_video.so android/app/src/main/jniLibs/x86_64/
          LIBCXX=$(find $ANDROID_NDK_HOME -name "libc++_shared.so" -path "*/x86_64/*" | head -1)
          if [ -n "$LIBCXX" ]; then cp "$LIBCXX" android/app/src/main/jniLibs/x86_64/; fi

      - name: Copy libwebrtc.jar
        run: |
          mkdir -p android/app/libs
          WEBRTC_JAR=$(find target -name "libwebrtc.jar" -path "*/android-x64-release/*" 2>/dev/null | head -1)
          if [ -n "$WEBRTC_JAR" ]; then
            cp "$WEBRTC_JAR" android/app/libs/
          else
            echo "::warning::libwebrtc.jar not found, tests may fail"
          fi

      - uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009 # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          script: cd android && ./gradlew connectedAndroidTest
