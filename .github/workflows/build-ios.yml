name: Build & Distribute iOS

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for testers"
        required: false
        default: ""
      publish:
        description: "Upload metadata to App Store Connect"
        required: false
        type: boolean
        default: false
  push:
    # Pushing a semver tag triggers build + TestFlight + ASC metadata.
    # Use vX.Y.Z for prod-ready releases (App Store metadata pushed,
    # ready for the manual 'Add for review' click) and vX.Y.Z-rcN for
    # build-only (TestFlight stays the canonical channel for RCs).
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    # ~15-25 min healthy. Cap at 60 to absorb a slow ASC upload retry
    # without ever burning the default 6h.
    timeout-minutes: 60
    # id-token + attestations enable SLSA build provenance: the runner
    # mints an OIDC token, Sigstore signs an attestation over the
    # artifact hash, and the result is stored against the repo so
    # anyone can verify "this IPA really came from this commit on
    # this workflow" via `gh attestation verify`.
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: .

    steps:
      # Pin to immutable SHA so retags on the trigger ref don't break the
      # checkout mid-build (we sometimes move v0.10.0 forward between CI
      # iterations on other workflows).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          rust-targets: aarch64-apple-ios
          cache-key: ios-arm64

      - name: Compile Rust native libraries
        run: |
          cargo build --target aarch64-apple-ios -p visio-ffi --release
          rm -f target/aarch64-apple-ios/release/*.dylib

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Set up SSH key for Match certificates repo
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Build & distribute to TestFlight
        timeout-minutes: 20
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: bundle exec fastlane distribute

      - name: Upload to App Store Connect
        # Publish when explicitly requested via workflow_dispatch input OR
        # when triggered by a non-RC semver tag push (vX.Y.Z, not -rcN).
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish == true) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc'))
        timeout-minutes: 20
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane release

      - name: Upload IPA artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: ios-ipa
          path: ios/build/VisioMobile.ipa
          retention-days: 14

      - name: Attest IPA build provenance
        # SLSA build provenance: signs an attestation that this IPA came
        # from this commit on this workflow. Stored against the repo;
        # verifiable with `gh attestation verify <file> --repo <repo>`.
        # No `if: always()` — there's no point attesting a missing IPA
        # if the build failed.
        uses: actions/attest-build-provenance@b3e506e8c389afc651c5bacf2b8f2a1ea0557215 # v4
        with:
          subject-path: ios/build/VisioMobile.ipa
