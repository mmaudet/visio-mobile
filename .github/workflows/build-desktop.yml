name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            # macos-15: Sequoia. macos-14 breaks webrtc-sys C++20
            # compilation (libc++ contiguous_range concept on rust::Slice)
            # against the SDK 14.5 shipped with Xcode 15.4. Stay on macos-15
            # and skip DMG bundling (bundle_dmg.sh fails reliably there) —
            # the .app + .app.tar.gz artefacts are sufficient for distrib.
            runner: macos-15
            rust-targets: aarch64-apple-darwin
            label: macos-arm64
          - platform: windows
            runner: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: linux
            runner: ubuntu-24.04
            rust-targets: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01 # v2
        with:
          key: desktop-${{ matrix.label }}

      # --- Linux system dependencies ---
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libva-dev \
            libpulse-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            flatpak \
            flatpak-builder

      # --- Node.js + frontend build ---
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: crates/visio-desktop/frontend
        run: npm ci

      - name: Build frontend
        working-directory: crates/visio-desktop/frontend
        run: npm run build

      # --- Tauri build ---
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app (Linux with PipeWire)
        if: matrix.platform == 'linux'
        working-directory: crates/visio-desktop
        run: cargo tauri build --features pipewire-camera

      - name: Build Tauri app (macOS)
        if: matrix.platform == 'macos'
        working-directory: crates/visio-desktop
        shell: bash
        # `-b app` skips the DMG target; bundle_dmg.sh fails reliably on the
        # GitHub macos-15 runner (Sequoia + the create-dmg ship'd with Tauri
        # 2.x at this point). The .app and .app.tar.gz artefacts are enough
        # for distribution; users can drag the .app to /Applications.
        run: cargo tauri build -b app
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows'
        working-directory: crates/visio-desktop
        shell: bash
        run: cargo tauri build

      - name: Inject macOS privacy permissions into Info.plist
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          APP_BUNDLE=$(find target/release/bundle -name "*.app" -type d | head -1)
          if [ -n "$APP_BUNDLE" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Visio Mobile needs microphone access for video calls'" "$APP_BUNDLE/Contents/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Visio Mobile needs camera access for video calls'" "$APP_BUNDLE/Contents/Info.plist" 2>/dev/null || true
            echo "Injected privacy descriptions into $APP_BUNDLE/Contents/Info.plist"
          fi

      # --- Flatpak build (Linux only, from source in GNOME SDK) ---
      - name: Install Flatpak SDK and runtime
        if: matrix.platform == 'linux'
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.gnome.Platform//47 \
            org.gnome.Sdk//47 \
            org.freedesktop.Sdk.Extension.llvm18//24.08

      - name: Vendor cargo dependencies for Flatpak
        if: matrix.platform == 'linux'
        run: cargo vendor cargo-vendor

      - name: Pre-download libwebrtc for Flatpak offline build
        if: matrix.platform == 'linux'
        run: |
          WEBRTC_URL="https://github.com/livekit/rust-sdks/releases/download/webrtc-0001d84-2/webrtc-linux-x64-release.zip"
          curl -L -o /tmp/webrtc.zip "$WEBRTC_URL"
          unzip -qo /tmp/webrtc.zip -d /tmp/webrtc-extract
          # Move extracted content to lk-webrtc (strip top-level dir if present)
          if [ -d /tmp/webrtc-extract/webrtc-linux-x64-release ]; then
            mv /tmp/webrtc-extract/webrtc-linux-x64-release lk-webrtc
          else
            mv /tmp/webrtc-extract lk-webrtc
          fi
          ls lk-webrtc/
          rm -f /tmp/webrtc.zip

      - name: Build Flatpak bundle
        if: matrix.platform == 'linux'
        run: flatpak/build-flatpak.sh

      # --- Upload artifacts ---
      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: desktop-macos-arm64
          path: |
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: desktop-windows-x64
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: desktop-linux-x64
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/flatpak/*.flatpak

  # --- GitHub Release with all artifacts ---
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-build-${{ github.run_number }}"
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="Desktop Build #${{ github.run_number }} from $(date -u +%Y-%m-%d)"
          fi

          # Collect all release files (use NUL-delimited to handle spaces in names)
          FILES=()
          while IFS= read -r -d '' f; do
            FILES+=("$f")
          done < <(find artifacts -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.flatpak" \) -print0)

          if [ ${#FILES[@]} -gt 0 ]; then
            gh release create "$TAG" \
              "${FILES[@]}" \
              --title "Desktop Build #${{ github.run_number }}" \
              --notes "$NOTES" \
              --prerelease
          else
            echo "::warning::No artifacts found for release"
          fi
